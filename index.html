<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cherno Alpha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Bem-vindo à nossa Landing Page</h1>
    </header>

    <main class="hero">

        <div class="imagem">
            <img 
                src="https://static.wikia.nocookie.net/pacificrim/images/6/63/Cerno_Aplha.jpg/revision/latest?cb=20131006220542"
                alt="Imagem do Jaeger Mark 1 Cherno Alpha e sua base"
            >
        </div>

        <div class="texto">

            <h2>Sobre o Jaeger</h2>

            <p>
                Cherno Alpha é o Jaeger Mark 1, da primeira geração, russo.
                Ele ficou no topo por 6 anos, um Jaeger que nunca aceitou
                cair fácil, nem mesmo sair da batalha.
            </p>

            <p>
                Responsável por defender a Rússia em todos esses anos,
                foi o último Mark 1 que restou de pé.
            </p>

        </div>

    </main>

</body>

</html>
